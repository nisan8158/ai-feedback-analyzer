<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Feedback</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: #172033;
        }

        .feedback-card {
            background: white;
            width: 100%;
            max-width: 680px;
            padding: 50px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #3730a3;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #667085;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 170px;
            padding: 18px;
            border: 1.5px solid #d0d5dd;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        textarea::placeholder {
            color: #98a2b3;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .privacy {
            color: #98a2b3;
            font-size: 13px;
        }

        #characterCount {
            color: #98a2b3;
            font-size: 13px;
        }

        button {
            width: 100%;
            border: none;
            background: #4f46e5;
            color: white;
            padding: 15px 20px;
            border-radius: 11px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            display: none;
            margin-top: 22px;
            padding: 15px 18px;
            border-radius: 10px;
            font-size: 15px;
        }

        .success {
            display: block !important;
            background: #ecfdf3;
            color: #067647;
            border: 1px solid #abefc6;
        }

        .error {
            display: block !important;
            background: #fef3f2;
            color: #b42318;
            border: 1px solid #fecdca;
        }

        .ai-note {
            text-align: center;
            color: #98a2b3;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 600px) {
            .feedback-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <main class="feedback-card">

        <div class="badge">AI Feedback Analyzer</div>

        <h1>Share Your Feedback</h1>

        <p class="subtitle">
            Tell us about your experience. Your feedback helps us understand
            what is working well and where we can improve.
        </p>

        <label for="feedbackInput">Your feedback</label>

        <textarea
            id="feedbackInput"
            maxlength="1000"
            placeholder="Tell us about your experience..."
        ></textarea>

        <div class="footer-row">
            <span class="privacy">Your feedback will be analyzed securely.</span>
            <span id="characterCount">0 / 1000</span>
        </div>

        <button id="submitButton" onclick="submitFeedback()">
            Submit Feedback
        </button>

        <div id="message"></div>

        <p class="ai-note">
            Powered by AI-based sentiment and feedback analysis
        </p>

    </main>

    <script>
        const feedbackInput = document.getElementById("feedbackInput");
        const characterCount = document.getElementById("characterCount");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        feedbackInput.addEventListener("input", function () {
            characterCount.innerText =
                feedbackInput.value.length + " / 1000";
        });

        async function submitFeedback() {

            const text = feedbackInput.value.trim();

            if (!text) {
                message.className = "error";
                message.innerText = "Please enter your feedback before submitting.";
                return;
            }

            submitButton.disabled = true;
            submitButton.innerText = "Submitting...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/feedback",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            text: text
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                await response.json();

                message.className = "success";
                message.innerText =
                    "✓ Thank you! Your feedback has been submitted successfully.";

                feedbackInput.value = "";
                characterCount.innerText = "0 / 1000";

            } catch (error) {

                message.className = "error";
                message.innerText =
                    "Something went wrong. Please try again.";

            } finally {

                submitButton.disabled = false;
                submitButton.innerText = "Submit Feedback";
            }
        }
    </script>

</body>
</html>
